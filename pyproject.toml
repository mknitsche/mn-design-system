[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mn-design-system"
version = "0.14.0"
description = "MN PKA Design-System — Tokens, Fonts, Komponenten fuer Multi-Renderer (PDF/Web/LaTeX)"
readme = "README.md"
requires-python = ">=3.10"
# PolyForm Strict 1.0.0 ist nicht in der SPDX-Liste; der Verweis auf die Datei
# ist die einzige Angabe, die dabei nicht falsch wird.
license = { file = "LICENSE" }
authors = [
    { name = "Matthias Nitsche" },
]
keywords = ["design-system", "tokens", "reportlab", "pdf", "style-dictionary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "reportlab>=4.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/mknitsche/mn-design-system"
Repository = "https://github.com/mknitsche/mn-design-system"

[tool.setuptools.packages.find]
where = ["."]
include = ["mn_design_system*"]
exclude = ["tests*", "dist*", "node_modules*"]

[tool.setuptools.package-data]
mn_design_system = [
    "fonts/**/*.ttf",
    "fonts/**/*.otf",
    "fonts/**/*.txt",
    "fonts/**/*.md",
    "fonts/**/LICENSE*",
]

[tool.ruff]
# Macht die bislang implizite Format-Konvention explizit (ruff-Default: 88).
# Aktivierung des Format-Gates pro Klon: `pre-commit install`.
target-version = "py310"
line-length = 88

# tokens.py wird von Style Dictionary generiert (npm run build) — ruff darf
# die generierte Datei NICHT formatieren, sonst divergiert sie vom Generator-
# Output und der Release-Schritt "Verify tokens.py synced" schlaegt fehl (cld1-S21).
extend-exclude = ["mn_design_system/tokens.py"]
# force-exclude: Excludes auch anwenden, wenn pre-commit Dateien explizit
# uebergibt — sonst greift extend-exclude beim Format-Gate-Hook nicht.
force-exclude = true
