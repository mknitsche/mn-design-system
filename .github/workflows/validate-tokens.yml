name: Validate Tokens

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build tokens
        run: npm run build

      - name: Validate (WCAG-AA + Required Tokens)
        run: npm run validate

      - name: Verify dist is up-to-date
        run: |
          git diff --exit-code dist/ || (echo "dist/ is out of sync - run 'npm run build' locally and commit" && exit 1)
